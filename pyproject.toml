[project]
name = "language-app"
version = "0.1.0"
description = "A voice-first, open source language tutor"
readme = "README.md"
authors = [
    { name = "Ana", email = "analilliam.recio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
language-app = "language_app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
